x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: dockerfile-airflow.dockerfile
  restart: always
  networks:
    - marketing-mds-net
  depends_on:
    airflow-postgres:
      condition: service_healthy
    postgres:
      condition: service_healthy
    postgres-dest:
      condition: service_healthy
  environment:
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"
    AIRFLOW__API__AUTH_MANAGER: "airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
    AIRFLOW__SIMPLE_AUTH_MANAGER__PASSWORDS_FILE: "/opt/airflow/passwords/simple_auth_manager_passwords.json.generated"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin123}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_DEST_USER: ${POSTGRES_DEST_USER}
    POSTGRES_DEST_PASSWORD: ${POSTGRES_DEST_PASSWORD}
    POSTGRES_DEST_DB: ${POSTGRES_DEST_DB}
    POSTGRES_DEST_SCHEMA: ${POSTGRES_DEST_SCHEMA:-raw}
    MINIO_ENDPOINT: ${MINIO_ENDPOINT}
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    MINIO_BUCKET: ${MINIO_BUCKET}
    MINIO_LOCAL_DIR: ${MINIO_LOCAL_DIR:-/tmp/minio_downloads}
  volumes:
    - ./docker/dags:/opt/airflow/dags
    - ./docker/logs:/opt/airflow/logs
    - ./docker/plugins:/opt/airflow/plugins
    - ./marketing_dbt:/opt/airflow/marketing_dbt
    - ./marketing_dbt/.dbt:/home/airflow/.dbt
    - ./docker/airflow_passwords:/opt/airflow/passwords

services:

  # ════════════════════════════════════════════════════════════════════════════
  # ZOOKEEPER
  # ════════════════════════════════════════════════════════════════════════════
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    restart: always
    networks:
      - marketing-mds-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | timeout 2 bash -c 'cat < /dev/null > /dev/tcp/localhost/2181'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  # KAFKA
  # ════════════════════════════════════════════════════════════════════════════
  kafka:
    image: confluentinc/cp-kafka:7.4.1
    container_name: kafka
    restart: always
    networks:
      - marketing-mds-net
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://host.docker.internal:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  # DEBEZIUM CONNECT
  # ════════════════════════════════════════════════════════════════════════════
  connect:
    image: debezium/connect:2.2
    container_name: debezium-connect
    restart: always
    networks:
      - marketing-mds-net
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: '1'
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  # POSTGRES — données source
  # ════════════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:15
    container_name: marketing-postgres-source
    restart: always
    networks:
      - marketing-mds-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
    command: >
      postgres
        -c wal_level=logical
        -c max_wal_senders=10
        -c max_replication_slots=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  # POSTGRES — données destination
  # ════════════════════════════════════════════════════════════════════════════
  postgres-dest:
    image: postgres:15
    container_name: marketing-postgres-destination
    restart: always
    networks:
      - marketing-mds-net
    environment:
      POSTGRES_USER: ${POSTGRES_DEST_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DEST_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DEST_DB}
    ports:
      - "5434:5432"
    volumes:
      - ./docker/postgres-dest/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  # MINIO
  # ════════════════════════════════════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    networks:
      - marketing-mds-net
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./docker/minio/data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  # POSTGRES — metadata Airflow
  # ════════════════════════════════════════════════════════════════════════════
  airflow-postgres:
    image: postgres:15
    container_name: airflow-postgres
    restart: always
    networks:
      - marketing-mds-net
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  # AIRFLOW INIT
  # ════════════════════════════════════════════════════════════════════════════
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "==> Migration de la base Airflow 3..."
        airflow db migrate
        echo "==> Generation du mot de passe admin..."
        bash /opt/airflow/create_admin.sh
        echo "==> Init termine."

  # ════════════════════════════════════════════════════════════════════════════
  # AIRFLOW API SERVER
  # ════════════════════════════════════════════════════════════════════════════
  airflow-api-server:
    <<: *airflow-common
    container_name: airflow-api-server
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy
      postgres-dest:
        condition: service_healthy
    ports:
      - "8080:8080"
    command: api-server
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v2/version || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  # AIRFLOW SCHEDULER
  # ════════════════════════════════════════════════════════════════════════════
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
      airflow-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy
      postgres-dest:
        condition: service_healthy
    command: scheduler

  # ════════════════════════════════════════════════════════════════════════════
  # AIRFLOW DAG PROCESSOR
  # ════════════════════════════════════════════════════════════════════════════
  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
      airflow-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy
      postgres-dest:
        condition: service_healthy
    command: dag-processor

volumes:
  airflow_postgres_data:
    name: marketing_airflow_postgres_data

networks:
  marketing-mds-net:
    name: marketing-mds-net
    driver: bridge