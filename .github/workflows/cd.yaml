name: CD
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_DEST_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_DEST_PASSWORD }}
          POSTGRES_DB: marketingdb_destination
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dbt postgres adapter
        run: |
          python -m pip install --upgrade pip
          pip install dbt-postgres==1.8.2

      - name: Setup dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOL
          marketing_dbt:
            target: prod
            outputs:
              prod:
                type: postgres
                host: localhost
                port: 5432
                user: ${{ secrets.POSTGRES_DEST_USER }}
                password: ${{ secrets.POSTGRES_DEST_PASSWORD }}
                dbname: marketingdb_destination
                schema: raw
                threads: 4
          EOL

      - name: dbt run + test (prod)
        run: |
          cd marketing_dbt
          dbt deps
          dbt run --profiles-dir ~/.dbt
          dbt test --profiles-dir ~/.dbt

      - name: dbt snapshot (SCD2)
        run: |
          cd marketing_dbt
          dbt snapshot --profiles-dir ~/.dbt