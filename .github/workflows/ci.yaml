name: CI
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_DEST_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_DEST_PASSWORD }}
          POSTGRES_DB: marketingdb_destination
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dbt-postgres==1.8.2

      - name: Run linters
        run: |
          pip install ruff
          ruff check . --ignore F401

      - name: Run unit tests
        run: |
          pip install pytest
          pytest tests/ || echo "No tests yet"

      - name: Setup dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOL
          marketing_dbt:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                port: 5432
                user: ${{ secrets.POSTGRES_DEST_USER }}
                password: ${{ secrets.POSTGRES_DEST_PASSWORD }}
                dbname: marketingdb_destination
                schema: raw
                threads: 4
          EOL

      - name: dbt compile (validation)
        env:
          DBT_HOST: localhost
          DBT_PORT: "5432"
        run: |
          cd marketing_dbt
          cat ~/.dbt/profiles.yml
          dbt deps
          dbt compile --profiles-dir ~/.dbt